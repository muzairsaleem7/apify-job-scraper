<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Scraper</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3.5' fill='%232f81f7'/><circle cx='7' cy='7' r='3.6' fill='none' stroke='white' stroke-width='1.3'/><path d='M9.7 9.7 12.6 12.6' stroke='white' stroke-width='1.6' stroke-linecap='round'/></svg>">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1f2328; --muted:#656d76; --line:#d8dee4; --soft:#eef1f4; --accent:#1f6feb; --ok:#1a7f37; --bad:#cf222e; --warn:#9a6700; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8d96a0; --line:#30363d; --soft:#1c2128; --accent:#4493f8; --ok:#3fb950; --bad:#f85149; --warn:#d29922; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:1080px; margin:0 auto; padding:22px 20px 60px; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin-bottom:16px; }
  h1 { font-size:20px; margin:0 auto 0 0; display:flex; align-items:center; gap:10px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:26px 0 10px; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border:1px solid var(--line); border-radius:999px; background:var(--card); font-size:13px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  .muted { color:var(--muted); font-size:12.5px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .banner { border-left:4px solid var(--warn); margin-bottom:14px; }

  /* flow */
  .flow { display:grid; grid-template-columns:repeat(6,1fr); gap:0; padding:12px 8px; }
  .step { position:relative; text-align:center; padding:0 6px; }
  .step:not(:last-child)::after { content:""; position:absolute; top:15px; left:calc(50% + 18px); right:calc(-50% + 18px); height:2px; background:var(--line); }
  .step.done:not(:last-child)::after { background:var(--ok); }
  .num { width:30px; height:30px; border-radius:50%; margin:0 auto 6px; display:grid; place-items:center; font-weight:700; font-size:13px; background:var(--soft); color:var(--muted); border:2px solid var(--line); }
  .step.done .num { background:var(--ok); border-color:var(--ok); color:#fff; }
  .step.active .num { background:var(--accent); border-color:var(--accent); color:#fff; animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent); } }
  .step b { display:block; font-size:13px; } .step span { font-size:11.5px; color:var(--muted); }
  @media (max-width:760px) { .flow { grid-template-columns:repeat(3,1fr); row-gap:14px; } .step::after { display:none; } }

  /* buttons */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:12px; }
  .tools { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; }
  button.cmd { position:relative; text-align:left; padding:14px 16px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--text); cursor:pointer; font:inherit; display:flex; flex-direction:column; gap:4px; }
  button.cmd.primary { border:2px solid var(--accent); }
  button.cmd.small { padding:10px 12px; }
  button.cmd:hover:not(:disabled) { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  button.cmd:disabled { cursor:not-allowed; opacity:.55; }
  button.cmd b { font-size:15px; } button.cmd.small b { font-size:14px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tag { font-size:11.5px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); white-space:nowrap; }
  .tag.paid { color:var(--warn); border-color:var(--warn); } .tag.free { color:var(--ok); border-color:var(--ok); }
  .tag.start { background:var(--accent); border-color:var(--accent); color:#fff; }
  .state { font-size:12.5px; font-weight:600; color:var(--muted); }
  .state.used { color:var(--ok); } .state.busy { color:var(--accent); }

  /* progress */
  .bar { height:8px; background:var(--soft); border-radius:999px; overflow:hidden; margin:10px 0 6px; }
  .bar i { display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .5s; }
  pre.log { background:#0d1117; color:#c9d1d9; padding:12px; border-radius:8px; max-height:320px; overflow:auto; font:12px/1.4 ui-monospace,Consolas,monospace; white-space:pre-wrap; margin:8px 0 0; }
  details > summary { cursor:pointer; color:var(--muted); font-size:12.5px; margin-top:10px; user-select:none; }

  /* result */
  .funnel { display:flex; flex-wrap:wrap; align-items:stretch; gap:6px; margin:12px 0; }
  .fbox { flex:1 1 120px; background:var(--soft); border-radius:10px; padding:10px 12px; }
  .fbox b { display:block; font-size:22px; line-height:1.2; }
  .fbox span { font-size:12px; color:var(--muted); }
  .fbox.hl { background:color-mix(in srgb,var(--accent) 14%,transparent); } .fbox.hl b { color:var(--accent); }
  .arrow { align-self:center; color:var(--muted); font-size:18px; }
  .cta { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; font-weight:600; font-size:13.5px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; font-family:inherit; }
  .cta.main { background:var(--accent); border-color:var(--accent); color:#fff; }
  .cta:hover { text-decoration:none; filter:brightness(1.07); }
  .btn { font:inherit; font-size:12.5px; padding:3px 9px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text); cursor:pointer; white-space:nowrap; }
  .btn:hover { border-color:var(--accent); text-decoration:none; }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:7px 8px 7px 0; border-top:1px solid var(--line); vertical-align:top; text-align:left; }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .path { font:12px ui-monospace,Consolas,monospace; color:var(--muted); cursor:copy; word-break:break-all; }
  .path:hover { color:var(--accent); }
  .fname { font-weight:600; word-break:break-all; }
  .status { font-size:12px; font-weight:600; padding:1px 8px; border-radius:999px; white-space:nowrap; }
  .status.ok { color:var(--ok); background:color-mix(in srgb,var(--ok) 12%,transparent); }
  .status.failed,.status.interrupted { color:var(--bad); background:color-mix(in srgb,var(--bad) 12%,transparent); }
  .status.running { color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,transparent); }
  .err { color:var(--bad); font-size:12.5px; margin-top:6px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; } @media (max-width:760px) { .two { grid-template-columns:1fr; } }
  .hist { margin-bottom:8px; padding:10px 14px; }
  .hist > summary { list-style:none; margin:0; color:var(--text); font-size:14px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .hist > summary::-webkit-details-marker { display:none; }
  .hist > summary::before { content:"▸"; color:var(--muted); } .hist[open] > summary::before { content:"▾"; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:8px 14px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Job Scraper</h1>
    <span class="chip" id="apify"><span class="dot"></span>Apify: …</span>
    <span class="chip" id="google"><span class="dot"></span>Google Sheets: …</span>
  </header>
  <div id="banner"></div>

  <div class="card flow" id="flow"></div>

  <h2>Step 1 · Find jobs</h2>
  <div class="grid" id="scrapes"></div>
  <p class="muted">Each button works once per day and unlocks at midnight. A run that fails doesn't count, so you can try again.</p>

  <div id="running"></div>
  <div id="latest"></div>

  <h2>Tools</h2>
  <div class="tools" id="tools"></div>

  <h2 id="histTitle">Run history</h2>
  <div id="history"></div>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
let S = null, timer = null;
const openSet = new Set(['log-running']), closedSet = new Set(), logCache = {};

const SITE = { linkedin: 'LinkedIn', indeed: 'Indeed', glassdoor: 'Glassdoor', wellfound: 'Wellfound', remoteok: 'RemoteOK', jobicy: 'Jobicy', wwr: 'We Work Remotely', workingnomads: 'Working Nomads', arbeitnow: 'Arbeitnow' };
const PAID = ['linkedin', 'indeed', 'glassdoor', 'wellfound'];
const DROP = { offTitle: 'title not in your list', excluded: 'junior / management / other role', offStack: 'built on another stack', notRemote: 'hybrid or on-site', flagged: 'needs security clearance', tooOld: 'older than the time window' };
const FILE = {
  new: ['New jobs', "Only jobs you haven't seen in earlier runs, best first. Start here."],
  all: ['All jobs', 'Every matching job from this run, including ones seen before.'],
  top: ['Top 30 shortlist', 'The best new jobs as a readable list with links.'],
  master: ['Master list', 'Every job ever found, across all runs.'],
};
const EXTRA = {
  'scrape-24h': 'Searches LinkedIn, Indeed, Glassdoor, Wellfound + 5 free boards for jobs posted since yesterday. ≈4 min · usually $0.30–0.40.',
  'scrape-7d': 'Same 9 sites, jobs from the last 7 days. Use after a break. ≈4–5 min · up to $0.58.',
  'free-7d': 'Only the 5 free remote boards, last 7 days. ≈30 s · $0.',
};

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Job-Scraper': '1' }, body: JSON.stringify(body ?? {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const fmtTime = (iso) => iso ? new Date(iso).toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const fmtDur = (s) => s == null ? '' : s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s`;
const since = (iso) => fmtDur(Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000)));
const n = (x) => (x ?? 0).toLocaleString();
const details = (key, summary, body, defaultOpen = false, cls = '') => {
  const open = openSet.has(key) || (defaultOpen && !closedSet.has(key));
  return `<details class="${cls}" data-key="${esc(key)}" ${open ? 'open' : ''}><summary>${summary}</summary>${body}</details>`;
};

// ---------- flow: where are we?
const STEPS = [
  ['Pick a scrape', 'a button below'],
  ['Search', '9 job sites'],
  ['Filter & score', 'your titles, remote only, 0–100'],
  ['Save files', 'CSV on this PC'],
  ['Google Sheets', 'run sheet + Job Tracker'],
  ['Your turn', 'set Status in the tracker'],
];
/** { done: steps finished, active: step in progress (or null) }. Idle = nothing highlighted. */
function flowStage() {
  const r = S.running;
  if (r && r.kind === 'scrape') {
    const phase = r.progress?.phase;
    if (phase === 'processing') return { done: 2, active: 2 };
    if (phase === 'saved') return { done: 4, active: S.google.connected ? 4 : null };
    return { done: 1, active: 1 };
  }
  const last = S.history[0];
  if (!last?.run || last.command === 'cli' || last.status !== 'ok') return { done: 0, active: null };
  if (last.uploading) return { done: 4, active: 4 };
  if (Date.now() - new Date(last.finishedAt) > 12 * 3600e3) return { done: 0, active: null };
  return last.trackerAdded != null ? { done: 5, active: 5 } : { done: 4, active: null };
}
function renderFlow() {
  const { done, active } = flowStage();
  $('flow').innerHTML = STEPS.map(([t, d], i) => {
    const cls = i === active ? 'active' : i < done ? 'done' : '';
    return `<div class="step ${cls}"><div class="num">${cls === 'done' ? '✓' : i + 1}</div><b>${t}</b><span>${d}</span></div>`;
  }).join('');
}

function renderHeader() {
  $('apify').innerHTML = `<span class="dot ${S.apify.ok ? 'ok' : S.apify.text.startsWith('checking') ? '' : 'bad'}"></span>Apify credit: ${esc(S.apify.text)}`;
  const g = S.google, el = $('google');
  if (!g.configured) el.innerHTML = `<span class="dot bad"></span>Google Sheets: not set up`;
  else if (!g.connected) el.innerHTML = `<span class="dot bad"></span><a href="/google/connect">Connect Google</a>`;
  else el.innerHTML = `<span class="dot ok"></span>${esc(g.email || 'Google')} · <a href="/sheets/tracker" target="_blank" rel="noopener">Job Tracker ↗</a> · <a href="#" id="disc">Disconnect</a>`;
  const d = $('disc'); if (d) d.onclick = async (e) => { e.preventDefault(); if (confirm('Disconnect Google? Your spreadsheets stay in Drive.')) { await post('/api/google/disconnect'); load(); } };
  $('banner').innerHTML = g.connected ? '' : `<div class="card banner"><b>Google Sheets is ${g.configured ? 'not connected' : 'not set up'}.</b> Scrapes still work and save CSV files on this PC, but steps 5–6 (spreadsheets and the Job Tracker) are skipped. ${g.configured ? '<a href="/google/connect">Connect Google</a> once to turn them on.' : 'See <b>SETUP.md → 8. Google Sheets</b>.'}</div>`;
}

function cmdButton(c, small) {
  const busy = S.running && S.running.command === c.id;
  const disabled = c.usedToday || Boolean(S.running);
  const state = busy ? `<span class="state busy">● Running… ${since(S.running.startedAt)}</span>`
    : c.usedToday ? `<span class="state used">✓ Done today at ${new Date(c.usedAt).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })} · unlocks tomorrow</span>`
    : S.running ? `<span class="state">Waiting for the current run…</span>` : `<span class="state">Ready</span>`;
  return `<button class="cmd ${small ? 'small' : ''} ${c.id === 'scrape-24h' && !small ? 'primary' : ''}" data-id="${c.id}" ${disabled ? 'disabled' : ''}>
    <span class="row"><b>${esc(c.label)}</b>${c.id === 'scrape-24h' ? '<span class="tag start">Start here · daily</span>' : ''}<span class="tag ${c.cost}">${c.cost === 'paid' ? 'uses Apify credit' : 'free'}</span></span>
    <span class="muted">${esc(EXTRA[c.id] || c.description)}</span>${state}</button>`;
}
function renderCommands() {
  $('scrapes').innerHTML = S.commands.filter((c) => c.kind === 'scrape').map((c) => cmdButton(c, false)).join('');
  $('tools').innerHTML = S.commands.filter((c) => c.kind !== 'scrape').map((c) => cmdButton(c, true)).join('');
  for (const b of document.querySelectorAll('button.cmd')) b.onclick = () => run(b.dataset.id);
}
async function run(id) {
  const c = S.commands.find((x) => x.id === id);
  const msg = c.cost === 'paid'
    ? `"${c.label}" spends Apify credit (usually $0.30–0.40, at most about $0.58).\nApify: ${S.apify.text}.\n\nThis button can be used once today. Start now?`
    : `Run "${c.label}"? This button can be used once today.`;
  if (!confirm(msg)) return;
  try { await post('/api/run', { command: id }); load(); } catch (e) { alert(e.message); }
}

// ---------- running now
function renderRunning() {
  const r = S.running;
  if (!r) { $('running').innerHTML = ''; return; }
  const pre = document.querySelector('#running pre');
  const atBottom = !pre || pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
  let prog = '';
  if (r.progress) {
    const p = r.progress;
    const parts = p.done + p.freeDone, all = p.total + p.freeTotal;
    const pct = p.phase === 'saved' ? 100 : p.phase === 'processing' ? 95 : all ? Math.round((parts / all) * 90) + 3 : 3;
    const text = {
      starting: 'Planning the searches and checking your Apify credit…',
      searching: `Searching job sites — ${p.total ? `${p.done} of ${p.total} paid searches` : ''}${p.total && p.freeTotal ? ' · ' : ''}${p.freeTotal ? `${p.freeDone} of ${p.freeTotal} free boards` : ''} done`,
      processing: 'All sites searched. Filtering, removing duplicates, scoring and comparing with your history…',
      saved: 'Files saved. Finishing up…',
    }[p.phase];
    prog = `<div class="bar"><i style="width:${pct}%"></i></div><div class="muted">${esc(text)}</div>`;
  }
  $('running').innerHTML = `<h2>Running now</h2><div class="card"><div class="row"><span class="status running">running</span><b>${esc(r.label)}</b><span class="muted">${since(r.startedAt)}</span></div>${prog}
    ${details('log-running', 'Live output', `<pre class="log">${esc(r.log.join('\n')) || 'starting…'}</pre>`, true)}</div>`;
  const p2 = document.querySelector('#running pre');
  if (p2 && atBottom) p2.scrollTop = p2.scrollHeight;
}

// ---------- results
function fileRows(files) {
  return `<table>${files.map((f) => {
    const [title, desc] = FILE[f.kind] || [f.name, ''];
    const sheet = f.openUrl ? `<a class="btn" href="${esc(f.sheetUrl || f.openUrl)}" target="_blank" rel="noopener" title="${f.sheetUrl ? 'Open the saved spreadsheet' : 'Save to Google Sheets, then open'}">Google Sheets ↗</a>` : '';
    return `<tr><td><div><b>${title}</b>${f.rows != null ? ` <span class="muted">· ${n(f.rows)} jobs</span>` : ''}</div><div class="muted">${esc(desc)}</div>
      <div class="fname" style="margin-top:4px;font-weight:500">${esc(f.name)}</div><div class="path" data-copy="${esc(f.path)}" title="Click to copy the path">${esc(f.path)}</div></td>
      <td style="text-align:right"><div class="row" style="justify-content:flex-end">${sheet}<button class="btn" data-open="${esc(f.path)}">Open file</button><button class="btn" data-reveal="${esc(f.path)}">Show in folder</button></div></td></tr>`;
  }).join('')}</table>`;
}
function siteTable(run) {
  const rows = Object.entries(run.perSource || {}).sort((a, b) => (PAID.includes(b[0]) - PAID.includes(a[0])) || b[1].found - a[1].found);
  if (!rows.length) return '';
  return `<table><tr><th>Site</th><th class="n">Searches</th><th class="n">Jobs found</th><th class="n">Matched</th></tr>${rows.map(([s, t]) =>
    `<tr><td>${esc(SITE[s] || s)} <span class="muted">${PAID.includes(s) ? 'Apify' : 'free'}</span></td><td class="n">${t.ok}${t.failed ? ` <span style="color:var(--bad)">+${t.failed} failed</span>` : ''}</td><td class="n">${n(t.found)}</td><td class="n">${n(t.kept)}</td></tr>`).join('')}</table>`;
}
function dropList(run) {
  const d = Object.entries(run.dropped || {}).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const merged = (run.totals?.afterFilters ?? 0) - (run.totals?.unique ?? 0);
  if (!d.length && !merged) return '';
  return `<table>${d.map(([k, v]) => `<tr><td>${esc(DROP[k] || k)}</td><td class="n">${n(v)}</td></tr>`).join('')}${merged ? `<tr><td>duplicates merged (same job on several sites)</td><td class="n">${n(merged)}</td></tr>` : ''}</table>`;
}
function sheetsLine(e) {
  if (e.uploading) return `<div class="muted">⏳ Saving to Google Sheets…</div>`;
  if (e.sheetsError) return `<div class="err">Google Sheets: ${esc(e.sheetsError)}</div>`;
  if (e.trackerAdded != null) return `<div class="muted" style="color:var(--ok)">✓ Saved to Google Sheets · ${n(e.trackerAdded)} new job(s) added to the Job Tracker</div>`;
  return '';
}

function renderLatest() {
  const e = S.history.find((x) => x.run && x.status !== 'running');
  if (!e) { $('latest').innerHTML = ''; return; }
  const r = e.run, t = r.totals || {};
  const newFile = e.files.find((f) => f.kind === 'new');
  const g = S.google;
  const ctas = g.connected
    ? `${newFile?.openUrl ? `<a class="cta main" href="${esc(newFile.sheetUrl || newFile.openUrl)}" target="_blank" rel="noopener">Open the ${n(t.new)} new jobs in Google Sheets ↗</a>` : ''}<a class="cta" href="/sheets/tracker" target="_blank" rel="noopener">Open Job Tracker ↗</a>`
    : `${newFile ? `<button class="cta main" data-open="${esc(newFile.path)}">Open the new jobs file</button>` : ''}${g.configured ? '<a class="cta" href="/google/connect">Connect Google to use Sheets</a>' : ''}`;
  $('latest').innerHTML = `<h2>Step 2–5 · Latest result</h2><div class="card">
    <div class="row"><span class="status ${e.status}">${e.status === 'ok' ? 'done' : e.status}</span><b>${esc(r.sheetTitle)}</b><span class="muted">${esc(fmtTime(e.startedAt))} · ${fmtDur(r.durationSec)}${typeof r.costUsd === 'number' ? ` · $${r.costUsd.toFixed(3)} Apify` : ''}${e.command === 'cli' ? ' · started from the terminal' : ''}</span></div>
    <div class="funnel">
      <div class="fbox"><b>${n(t.collected)}</b><span>jobs found on ${Object.keys(r.perSource || {}).length || r.sources.length} sites</span></div><div class="arrow">→</div>
      <div class="fbox"><b>${n(t.afterFilters)}</b><span>passed your filters</span></div><div class="arrow">→</div>
      <div class="fbox"><b>${n(t.unique)}</b><span>unique jobs (duplicates merged)</span></div><div class="arrow">→</div>
      <div class="fbox hl"><b>${n(t.new)}</b><span>new — not seen before</span></div>
    </div>
    ${r.errors ? `<div class="err">${r.errors} search(es) failed; the other sites were saved normally. See the output below.</div>` : ''}
    ${sheetsLine(e)}
    <div class="row" style="margin:12px 0 4px">${ctas}</div>
    <div style="margin-top:12px"><b style="font-size:13px">Files on this PC</b> <span class="muted">· click a path to copy it</span>${fileRows(e.files)}</div>
    <div class="two">
      <div>${details(`sites-${e.id}`, 'Where the jobs came from', siteTable(r))}</div>
      <div>${details(`drop-${e.id}`, 'Why jobs were removed', dropList(r))}</div>
    </div>
    ${e.hasLog ? details(`log-${e.id}`, 'Full output', `<pre class="log">${esc((logCache[e.id] || ['loading…']).join('\n'))}</pre>`) : ''}
  </div>`;
}

function renderHistory() {
  const latest = S.history.find((x) => x.run && x.status !== 'running');
  const items = S.history.filter((e) => e !== latest && e.status !== 'running');
  $('histTitle').textContent = `Earlier runs (${items.length})`;
  if (!items.length) { $('history').innerHTML = `<p class="muted">${latest ? 'Earlier runs will appear here.' : 'No runs yet. Click a button above.'}</p>`; return; }
  $('history').innerHTML = items.map((e) => {
    const r = e.run, t = r?.totals;
    const sum = r ? `${n(t?.unique)} jobs · <b>${n(t?.new)} new</b>${typeof r.costUsd === 'number' ? ` · $${r.costUsd.toFixed(3)}` : ''} · ${fmtDur(r.durationSec)}` : e.finishedAt ? fmtDur(Math.round((new Date(e.finishedAt) - new Date(e.startedAt)) / 1000)) : '';
    const body = `${r ? `<div class="muted" style="margin-top:6px">${esc(r.sheetTitle)}</div>` : ''}${sheetsLine(e)}${e.files.length ? fileRows(e.files) : ''}
      ${e.hasLog ? details(`log-${e.id}`, 'Output', `<pre class="log">${esc((logCache[e.id] || ['loading…']).join('\n'))}</pre>`) : ''}`;
    return details(`h-${e.id}`, `<span class="status ${e.status}">${e.status === 'ok' ? 'done' : e.status}</span><b>${esc(e.label)}</b><span class="muted">${esc(fmtTime(e.startedAt))}</span><span class="muted" style="margin-left:auto">${sum}</span>`, body, false, 'card hist');
  }).join('');
}

function wire() {
  for (const el of document.querySelectorAll('[data-copy]')) el.onclick = () => navigator.clipboard.writeText(el.dataset.copy).then(() => toast('Path copied'));
  for (const el of document.querySelectorAll('[data-open]')) el.onclick = () => post('/api/open', { path: el.dataset.open }).catch((e) => alert(e.message));
  for (const el of document.querySelectorAll('[data-reveal]')) el.onclick = () => post('/api/open', { path: el.dataset.reveal, reveal: true }).catch((e) => alert(e.message));
  for (const d of document.querySelectorAll('details[data-key]')) d.ontoggle = async () => {
    const key = d.dataset.key;
    if (d.open) { openSet.add(key); closedSet.delete(key); } else { openSet.delete(key); closedSet.add(key); }
    const id = key.startsWith('log-') && key !== 'log-running' ? key.slice(4) : null;
    if (d.open && id && !logCache[id]) { logCache[id] = (await (await fetch(`/api/log?id=${encodeURIComponent(id)}`)).json()).log; render(); }
  };
}

function render() { renderHeader(); renderFlow(); renderCommands(); renderRunning(); renderLatest(); renderHistory(); wire(); }

async function load() {
  clearTimeout(timer);
  try { S = await (await fetch('/api/state')).json(); render(); }
  catch { $('history').innerHTML = '<p class="err">Lost connection to the Job Scraper server. Is its terminal window still open? Start it again with <code>npm start</code>.</p>'; }
  const busy = S && (S.running || S.history.some((e) => e.uploading));
  timer = setTimeout(load, busy ? 1500 : 10000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
load();
</script>
</body>
</html>
